<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="title desc">
  <title id="title">Furkan Emre Çördük</title>
  <desc id="desc">Junior Software Developer focused on Backend Development</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58a6ff"/>
      <stop offset=".52" stop-color="#39d353"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="name-reveal">
      <rect x="0" y="0" width="0" height="54">
        <animate attributeName="width" from="0" to="520" dur="1.5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .enter { opacity:0; transform:translateY(8px); animation:enter .65s cubic-bezier(.2,.8,.2,1) forwards; }
    .role { animation-delay:1.15s; }
    .focus { animation-delay:1.45s; }
    .pulse { animation:pulse 2.4s ease-in-out infinite; transform-origin:center; }
    .cursor { animation:blink .8s steps(1) infinite; }
    @keyframes enter { to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:.9; transform:scale(1.15); } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .enter { opacity:1; transform:none; animation:none; } .pulse,.cursor { animation:none; } }
  </style>

  <rect x="1" y="1" width="858" height="248" rx="18" fill="url(#background)" stroke="#30363d"/>
  <circle class="pulse" cx="74" cy="76" r="28" fill="#39d353" opacity=".45" filter="url(#glow)"/>
  <circle cx="74" cy="76" r="8" fill="#39d353"/>
  <path d="M74 98v78" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".65">
    <animate attributeName="stroke-dasharray" values="0 90;90 0" dur="1.2s" fill="freeze"/>
  </path>

  <g transform="translate(126 50)" clip-path="url(#name-reveal)">
    <text x="0" y="38" fill="#f0f6fc" font-size="36" font-weight="700">Furkan Emre Çördük</text>
  </g>
  <rect class="cursor" x="507" y="57" width="3" height="38" rx="1" fill="#39d353">
    <animate attributeName="x" from="126" to="507" dur="1.5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
  </rect>

  <g class="enter role">
    <text x="126" y="137" fill="#8b949e" font-size="15">ROLE</text>
    <text x="205" y="137" fill="#e6edf3" font-size="20">Junior Software Developer</text>
  </g>
  <g class="enter focus">
    <text x="126" y="181" fill="#8b949e" font-size="15">FOCUS</text>
    <text x="205" y="181" fill="#e6edf3" font-size="20">Backend Development</text>
  </g>

  <rect x="126" y="211" width="650" height="2" rx="1" fill="#21262d"/>
  <rect x="126" y="211" width="0" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" from="0" to="650" begin="1.2s" dur="1.4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
  </rect>
</svg>
