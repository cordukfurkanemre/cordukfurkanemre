<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="title desc">
  <title id="title">Furkan Emre Çördük</title>
  <desc id="desc">Junior Software Developer focused on Backend Development</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58a6ff"/>
      <stop offset=".52" stop-color="#39d353"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="name-reveal">
      <rect x="0" y="0" width="0" height="54">
        <animate attributeName="width" from="0" to="600" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .enter { opacity:0; transform:translateY(8px); animation:enter .65s cubic-bezier(.2,.8,.2,1) forwards; }
    .role { animation-delay:1.15s; }
    .focus { animation-delay:1.45s; }
    .cursor { animation:blink .8s steps(1) infinite; }
    @keyframes enter { to { opacity:1; transform:translateY(0); } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .enter { opacity:1; transform:none; animation:none; } .cursor { animation:none; } }
  </style>

  <rect x="1" y="1" width="858" height="248" rx="18" fill="url(#background)" stroke="#30363d"/>
  <g transform="translate(64 50)" clip-path="url(#name-reveal)">
    <text x="0" y="38" fill="#f0f6fc" font-size="36" font-weight="700">Furkan Emre Çördük</text>
  </g>
  <rect class="cursor" x="445" y="57" width="3" height="38" rx="1" fill="#58a6ff">
    <animate attributeName="x" from="64" to="445" dur="1.8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
  </rect>

  <g class="enter role">
    <text x="64" y="137" fill="#8b949e" font-size="15">ROLE</text>
    <text x="143" y="137" fill="#e6edf3" font-size="20">Junior Software Developer</text>
  </g>
  <g class="enter focus">
    <text x="64" y="181" fill="#8b949e" font-size="15">FOCUS</text>
    <text x="143" y="181" fill="#e6edf3" font-size="20">Backend Development</text>
  </g>

  <rect x="64" y="211" width="732" height="2" rx="1" fill="#21262d"/>
  <rect x="64" y="211" width="0" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" from="0" to="732" begin="1.25s" dur="1.5s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
  </rect>
</svg>
