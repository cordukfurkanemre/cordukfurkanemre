<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" role="img" aria-labelledby="title">
  <title id="title">Furkan Emre Çördük's Portfolio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#092c26"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#39d353"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .card{opacity:0;transform:translateY(12px);animation:enter .7s .35s cubic-bezier(.2,.8,.2,1) forwards}
    .halo{animation:pulse 2.6s .3s ease-in-out infinite;transform-origin:70px 64px}
    .globe{animation:turn 5s linear infinite;transform-origin:70px 64px}
    .arrow{animation:arrow 1.5s 1.3s ease-in-out infinite}
    .trace{stroke-dasharray:180 450;animation:trace 3s .35s linear infinite}
    @keyframes enter{to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{50%{opacity:.75;transform:scale(1.12)}}
    @keyframes turn{to{transform:rotate(360deg)}}
    @keyframes arrow{50%{transform:translateX(6px)}}
    @keyframes trace{to{stroke-dashoffset:-630}}
    @media(prefers-reduced-motion:reduce){.card{opacity:1;transform:none;animation:none}.halo,.globe,.arrow,.trace{animation:none}}
  </style>
  <g class="card">
    <rect x="2" y="2" width="316" height="166" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
    <rect class="trace" x="3" y="3" width="314" height="164" rx="19" fill="none" stroke="url(#edge)" stroke-width="3"/>
    <circle class="halo" cx="70" cy="64" r="35" fill="#39d353" opacity=".24" filter="url(#glow)"/>
    <g class="globe" fill="none" stroke="#39d353" stroke-width="2.5">
      <circle cx="70" cy="64" r="27"/><path d="M43 64h54M70 37c10 12 10 42 0 54M70 37c-10 12-10 42 0 54"/>
    </g>
    <text x="122" y="61" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="2">EXPLORE</text>
    <text x="122" y="87" fill="#f0f6fc" font-family="ui-monospace,Consolas,monospace" font-size="25" font-weight="700">Portfolio</text>
    <text x="43" y="128" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="13">cordukfurkanemre.com</text>
    <text class="arrow" x="276" y="132" fill="#39d353" font-family="Arial,sans-serif" font-size="30">›</text>
  </g>
</svg>
