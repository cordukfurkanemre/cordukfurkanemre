<svg xmlns="http://www.w3.org/2000/svg" width="190" height="48" viewBox="0 0 190 48" role="img" aria-labelledby="title">
  <title id="title">Portfolio</title>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#39d353"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .button{opacity:0;transform:translateY(7px);animation:enter .65s .35s cubic-bezier(.2,.8,.2,1) forwards}
    .arrow{animation:move 1.4s 1.2s ease-in-out infinite}
    .line{animation:draw 1.1s .65s ease-out forwards;stroke-dasharray:160;stroke-dashoffset:160}
    @keyframes enter{to{opacity:1;transform:translateY(0)}}
    @keyframes move{50%{transform:translateX(4px)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.button{opacity:1;transform:none;animation:none}.arrow,.line{animation:none;stroke-dashoffset:0}}
  </style>
  <g class="button">
    <rect x="1" y="1" width="188" height="46" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="26" cy="24" r="11" fill="none" stroke="#39d353" stroke-width="2"/>
    <path d="M15 24h22M26 13c4 5 4 17 0 22M26 13c-4 5-4 17 0 22" fill="none" stroke="#39d353" stroke-width="1.5"/>
    <text x="51" y="30" fill="#e6edf3" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="600">Portfolio</text>
    <text class="arrow" x="163" y="30" fill="#39d353" font-family="Arial,sans-serif" font-size="18">›</text>
    <path class="line" d="M16 41H174" stroke="url(#border)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
