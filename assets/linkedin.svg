<svg xmlns="http://www.w3.org/2000/svg" width="385" height="140" viewBox="0 0 385 140" role="img" aria-labelledby="title">
  <title id="title">LinkedIn profile</title>
  <defs>
    <clipPath id="reveal"><rect width="0" height="25"><animate attributeName="width" from="0" to="300" begin=".35s" dur="1s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .card{opacity:0;transform:translateY(6px);animation:enter .5s .1s ease-out forwards}
    .cursor{animation:blink .8s 1.3s steps(1) infinite;opacity:0}
    @keyframes enter{to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.card,.cursor{opacity:1;transform:none;animation:none}}
  </style>
  <g class="card">
    <rect x="1" y="1" width="383" height="138" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect x="1" y="1" width="383" height="35" rx="12" fill="#161b22"/>
    <rect x="1" y="24" width="383" height="12" fill="#161b22"/>
    <circle cx="17" cy="18" r="4" fill="#58a6ff"/>
    <text x="30" y="23" fill="#8b949e" font-size="12">linkedin.ts</text>
    <text x="18" y="66" fill="#484f58" font-size="11">1</text>
    <text x="39" y="66" font-size="15"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> profile</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#a5d6ff">"LinkedIn"</tspan><tspan fill="#c9d1d9">;</tspan></text>
    <text x="18" y="98" fill="#484f58" font-size="11">2</text>
    <g transform="translate(39 80)" clip-path="url(#reveal)">
      <text y="18" font-size="15"><tspan fill="#79c0ff">open</tspan><tspan fill="#c9d1d9">(</tspan><tspan fill="#a5d6ff">"in/cordukfurkanemre"</tspan><tspan fill="#c9d1d9">);</tspan></text>
    </g>
    <rect class="cursor" x="277" y="82" width="2" height="20" fill="#58a6ff"/>
    <text x="346" y="121" fill="#58a6ff" font-size="18">↗</text>
  </g>
</svg>
